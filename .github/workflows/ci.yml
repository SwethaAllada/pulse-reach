name: PulseReach CI

on:
  push:
    branches: [main, master, siri_dev_pr]
  pull_request:
    branches: [main, master]

jobs:
  backend-and-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pulsereach_test
          POSTGRES_USER: pulsereach
          POSTGRES_PASSWORD: pulsereach_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql+psycopg://pulsereach:pulsereach_test_password@localhost:5432/pulsereach_test
      DATABASE_URL: postgresql+psycopg://pulsereach:pulsereach_test_password@localhost:5432/pulsereach_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Alembic migrations (0001..head)
        working-directory: backend
        run: alembic upgrade head

      - name: Run backend test suite (including PostgreSQL integration tests)
        working-directory: backend
        run: pytest -q

      - name: Run data-pipeline test suite
        working-directory: data-pipeline
        run: pytest -q
