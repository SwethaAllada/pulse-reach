# Run from repo root: docker compose --env-file .env -f infrastructure/docker-compose.yml up
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DATA_SOURCE: ${DATA_SOURCE:-db}
      PULSE_REACH_REPO_ROOT: /app
      RULES_DIR: /app/data-pipeline/rules
      DATA_DIR: /app/data
      CORS_ORIGINS: http://localhost:3000
    volumes:
      - ../data-pipeline/rules:/app/data-pipeline/rules:ro
      - ../data:/app/data:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
