  - id: SRC-07-NHANES
    name: CDC NHANES, August 2021 – August 2023 cycle (`_L` suffix)
    publisher: CDC / National Center for Health Statistics
    url: https://wwwn.cdc.gov/nchs/nhanes/
    file_url_pattern: https://wwwn.cdc.gov/Nchs/Data/Nhanes/Public/2021/DataFiles/<FILE>.xpt
    provides: Individual-level de-identified US survey measurements.
    downloadable_data: true
    file_format: SAS XPT transport files
    acquisition:
      state: excluded
      checked: 2026-11-14
      availability: >-
        CONFIRMED AVAILABLE. HTTP 200 with Content-Length returned today for DEMO_L (2,582,160 B),
        BMX_L (1,563,200 B), BPXO_L (696,720 B), GHB_L (174,000 B), TCHOL_L (259,520 B),
        GLU_L (129,200 B), DIQ_L (847,600 B). No registration, no login.
      reason: >-
        Deliberately deferred, not blocked. NHANES is useful only for value DISTRIBUTIONS and
        pipeline smoke-testing, and nothing in Phase 3 (database implementation) consumes it.
        Downloading ~5.3 MB of US survey data before there is a pipeline to test it with would
        put US data in the repo ahead of any use for it. Acquire at the point the transformation
        or ML code needs it.
      when_needed: >-
        Fetch DEMO_L, BMX_L, BPXO_L, GHB_L, TCHOL_L into data/raw/nhanes/ (5 files, ~5.3 MB).
        Not the full cycle; not dietary; not limited-access.
    coverage: United States, Aug 2021 – Aug 2023. Complex multistage probability sample.
    relevance: >-
      BMI, waist circumference, BP, HbA1c and lipids map almost one-to-one onto the IFHAS Major
      Package measures, which makes NHANES a realistic shape for pipeline and model mechanics.
    limitations:
      - MUST NOT be used as Abu Dhabi prevalence or to validate local thresholds. US sample.
      - Under RAI §3.1.5.1.1 an NHANES-derived model is a technical scaffold and must be labelled so.
      - Contains no well-child, IFHAS, outreach, appointment or completion constructs.
      - NCHS Data User Agreement terms not read in full (unresolved); Legal review required per RAI §3.2.1.5.
    belongs_in: data/raw/nhanes/   # when acquired
    verification: verified
    validation: none

