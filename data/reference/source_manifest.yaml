# PulseReach — data source manifest
#
# One entry per external source that was researched for the project. The manifest records
# ACQUISITION STATUS, not research status: `acquisition.state` says whether a file is on disk
# in this repository, and nothing else in this file may contradict it.
#
# Acquisition states:
#   researched        Source inspected online. No file obtained, and none needed.
#   document_obtained A source DOCUMENT (standard, guideline) is held locally.
#   dataset_obtained  A DATASET file is held locally in data/raw/.
#   blocked           Download attempted from this environment and failed. Reason recorded verbatim.
#   excluded          Deliberately not acquired (restricted, out of scope, or not useful).
#
# Validation states (datasets only):
#   none        Not inspected.
#   structural  File opened, sheets/columns/row counts inspected, totals cross-checked.
#   clinical    Reviewed by a qualified healthcare professional. NOTHING here is `clinical`.
#
# `verification` follows docs/data-sources.md: verified | reported | unresolved.

manifest_version: 2.0.0
generated: 2026-11-15
generated_by: Phase 2.5 comprehensive official data acquisition and validation
network_context: >-
  All checks were run from a non-UAE network (Cloudflare edge MAA) on 2026-11-14/15.
  doh.gov.ae and mohap.gov.ae terminate the TLS handshake at Client Hello; the *.fcsc.gov.ae
  API hosts return Cloudflare HTTP 403. Those are environment limitations, NOT evidence that
  the sources are unavailable or that the files do not exist. Re-verify from a UAE network.
  IMPORTANT EXCEPTION: tableau.doh.gov.ae has NO DNS A record at all, so the 18 DoH datasets
  pointing at it are dead links in the publisher's own catalogue, not a network block.
changes_in_v2: >-
  Two machine-readable official endpoints were located and harvested, superseding earlier
  "not downloadable" conclusions: (1) the SCAD statistics API on statad.gov.ae (86 indicators,
  SRC-17), and (2) the Abu Dhabi SDI ArcGIS OpenData service (5,339 geocoded health
  facilities, SRC-18). SRC-12 (census population) and SRC-01B (addata.gov.ae) are superseded.
  See docs/data-acquisition-report.md.

