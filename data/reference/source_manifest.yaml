# PulseReach — data source manifest
#
# One entry per external source that was researched for the project. The manifest records
# ACQUISITION STATUS, not research status: `acquisition.state` says whether a file is on disk
# in this repository, and nothing else in this file may contradict it.
#
# Acquisition states:
#   researched        Source inspected online. No file obtained, and none needed.
#   document_obtained A source DOCUMENT (standard, guideline) is held locally.
#   dataset_obtained  A DATASET file is held locally in data/raw/.
#   blocked           Download attempted from this environment and failed. Reason recorded verbatim.
#   excluded          Deliberately not acquired (restricted, out of scope, or not useful).
#
# Validation states (datasets only):
#   none        Not inspected.
#   structural  File opened, sheets/columns/row counts inspected, totals cross-checked.
#   clinical    Reviewed by a qualified healthcare professional. NOTHING here is `clinical`.
#
# `verification` follows docs/data-sources.md: verified | reported | unresolved.

manifest_version: 1.0.0
generated: 2026-11-14
generated_by: Phase 2.5 data acquisition and readiness audit
network_context: >-
  All checks were run from a non-UAE network on 2026-11-14. Several UAE government hosts
  (doh.gov.ae, mohap.gov.ae, addata.gov.ae) terminated the TLS handshake. That is an
  environment limitation, NOT evidence that the sources are unavailable or that the files
  do not exist. Re-verify from a UAE network before concluding anything about them.

