    publisher: Federal Competitiveness and Statistics Centre (UAE federal)
    url: https://uaestat.fcsc.gov.ae/en
    api:
      sdmx_rest:
        - https://releaseeuaestat.fcsc.gov.ae/rest
        - https://designuaestat.fcsc.gov.ae/rest
      documented_at: https://sis-cc.gitlab.io/dotstatsuite-documentation/using-api/api-main-features/
      note: Endpoints recovered from the /vis page config. A standard .Stat SDMX REST API.
    provides: >-
      SOUGHT per the brief: health facilities by emirate/type/sector, healthcare professionals
      by emirate and gender/sector, outpatients and inpatients by emirate and sector,
      physicians by licensure and emirate, population estimates and demographic tables.
    downloadable_data: unknown
    file_format: SDMX-JSON / SDMX-ML / CSV (per .Stat Suite defaults) — unconfirmed
    acquisition:
      state: blocked
      checked: 2026-11-15
      reason: >-
        HTTP 403 from Cloudflare (server: cloudflare, cf-ray: a5a6350f59287ebc-MAA) on every
        API host: releaseeuaestat, designuaestat, apiuaestat, chartsuaestat, and
        opendata.fcsc.gov.ae. Retried with a full browser header set (Accept for
        application/vnd.sdmx.structure+json, Referer and Origin of uaestat.fcsc.gov.ae,
        Sec-Fetch-Mode: cors) — still 403. NOTE: https://uaestat.fcsc.gov.ae/vis returns
        HTTP 200, so the host is alive and serving; the WAF specifically rejects the data API
        paths from this network edge.
      manual_instructions: >-
        From a permitted network, call GET <base>/dataflow/all/all/latest with
        Accept: application/vnd.sdmx.structure+json;version=1.0 to list dataflows, then
        GET <base>/data/<dataflow>/all for the series. Record each dataflow id, dimension list,
        reference period and the stated licence before use.
    coverage: UAE federal — NOT Abu Dhabi-specific. Any emirate breakdown must be checked per dataflow.
    relevance: >-
      Would be the cross-check on SCAD and MOHAP indicators that the brief asks for. Lower
      priority than SCAD, which is authoritative for the emirate and was fully acquired.
    limitations:
      - Inaccessible from this environment (403). Federal scope, not emirate scope.
      - >-
        Cross-checking is only valid where definitions and reference periods match; FCSC
        emirate figures and SCAD figures are not interchangeable by default.
    belongs_in: nowhere   # until obtained from a permitted network
    verification: unresolved
    validation: none
