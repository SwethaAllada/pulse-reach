  - id: SRC-17-SCAD-STATISTICS-API
    name: SCAD Statistics API (Key Statistics Indicators) — Abu Dhabi
    publisher: Statistics Centre – Abu Dhabi (SCAD)
    landing_page: https://statad.gov.ae/health?ThemeID=221&tab=KSI
    api:
      proxy_base: https://statad.gov.ae/o/communication?url=
      overview: Statistics/GetClickhouseKeyStatisticsIndicatorsOverview?themeId=221&lang=EN
      detail: Statistics/GetClickhouseIndicatorDetail?indicatorId=<ID>&lang=EN
      metadata_xlsx: Statistics/GetMetadataAndMethodology?indicatorId=<ID>&lang=EN
      discovery_method: >-
        The Liferay indicator page is a server-rendered shell. The three API paths above are
        declared as literal consts inside an inline <script type="module"> on the page, together
        with the PROXY_BASE. The data is fetched client-side through that Liferay proxy. No
        authentication, no API key, no registration.
      authentication: none
      note: >-
        The overview call returns 1,700 indicators across ALL themes (not only health). The
        `themeId` parameter does not filter the response; selection must be done client-side.
    provides: >-
      Abu Dhabi indicator time series with full dimensional breakdowns: population estimates and
      projections, health-system capacity (hospitals, beds, clinics, health centres, pharmacies),
      workforce (physicians, nurses, pharmacists, clinicians), utilisation (inpatients,
      outpatients), vital statistics (births, deaths, stillbirths), the complete
      infant/neonatal/post-neonatal/under-five mortality set, cancer deaths, communicable
      disease notifications, and health insurance membership.
    downloadable_data: true
    file_format: JSON (indicator detail) + XLSX (official metadata & methodology, per indicator)
    acquisition:
      state: dataset_obtained
      local_path: data/raw/statad_api/
      downloaded: 2026-11-15
      http_status: 200
      indicators_acquired: 86
      metadata_workbooks_acquired: 71
      file_count: 158
      bytes_total: 6484000   # approx; per-file SHA-256 in data/reference/raw_checksums.sha256
      acquisition_log: data/raw/statad_api/acquisition_log.json
      script: data-pipeline/ingestion/fetch_statad_indicators.py
      modified_after_download: false
      note: >-
        15 of 86 indicators returned no metadata XLSX (the endpoint returned JSON rather than a
        workbook). The indicator detail JSON was obtained for all 86.
    reference_period: Latest observation 2025 for most indicators; series from 1960 (population) and 1977 (births)
    data_source_within_file: '"data_source": "SCAD Official" / "Source: SCAD Official Data"'
    coverage: >-
      Emirate of Abu Dhabi. Region dimension is consistently Abu Dhabi Region / Al Ain Region /
      Al Dhafra Region, plus an "Emirate of Abu Dhabi" aggregate member and, in vital statistics,
      "Abroad" and "Missing/Unknown". Aggregate only — no individual records.
    permitted_reuse: >-
      SCAD terms of use, re-read verbatim 2026-11-15 at https://statad.gov.ae/terms-of-use
      (unchanged from the scad.gov.ae wording): "The content of this website, including
      publications, tables, etc., may be reproduced, in whole or in part, and by any means,
      without further permission from SCAD, provided that SCAD is fully acknowledged with the
      following statements: Source: Statistics Centre – Abu Dhabi; year of publication, name of
      the statistical product, catalogue and archive numbers, reference period and page(s)."
      Reproduction permitted WITH attribution. Commercial use not addressed explicitly —
      Legal review still required per RAI §3.2.1.5.
    relevance: >-
      The single most valuable source acquired. Closes the population-structure gap (P1/P2) with
      real series, gives 2025 regional capacity and workforce denominators, and supplies the
      1977-2025 birth series the Well-Child cohort needs (closes gap B6).
    limitations:
      - >-
        CRITICAL: 65 of 86 indicators embed an aggregate member ("Total", or "Emirate of Abu
        Dhabi" in REGION_EN) INSIDE the dimension. Naive SUM double-counts — e.g.
        births_by_gender sums to 82,470 against a true 41,235. Filter aggregates explicitly.
      - >-
        35 of 86 indicators carry a "Missing/Unknown" dimension member. It is a real category
        and must be preserved, never coerced to zero or dropped.
      - >-
        Indicator 4868 returns the age bands 5-9 and 10-14 as the strings "2026-05-09" and
        "2026-10-14" — upstream date coercion, affecting the Arabic labels identically. Values
        are intact; labels must be remapped explicitly.
      - 2024 age bands sum to 4,146,925 vs a stated 4,135,985 (+10,940) — disclosure rounding.
      - Aggregate only. Never individual data, never a prevalence source.
      - No preventive-screening indicator of any kind (searched; none exists).
      - Undocumented endpoint — not a contractual API. It may change without notice.
    belongs_in: data/raw/statad_api/
    verification: verified
    validation: structural

  - id: SRC-18-ABUDHABI-SDI-FACILITIES
