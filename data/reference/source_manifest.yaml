  - id: SRC-22-IFHAS-PROGRAMME-STATISTICS
    name: IFHAS and Well-Child Visit aggregate programme performance statistics
    publisher: DoH / Abu Dhabi Public Health Center (ADPHC)
    provides: >-
      SOUGHT: eligible population, screening participation, completion, package-wise and
      regional participation, follow-up and referral completion. Equivalent Well-Child Visit
      uptake by age group.
    downloadable_data: false
    file_format: null
    acquisition:
      state: blocked
      checked: 2026-11-15
      reason: >-
        NOT PUBLISHED. This is a publication gap, not a network failure. Checked: (1) the ADPHC
        IFHAS programme page (HTTP 200, read in full — describes the programme, gives no
        performance figures); (2) the Abu Dhabi Open Data catalogue, all 614 datasets — the term
        "screening" returns exactly 1 match and it is not a screening-programme dataset;
        (3) the SCAD statistics API, all 1,700 indicators — no screening, uptake, participation
        or preventive-care indicator exists; (4) web search of ADPHC/DoH media and publications.
        Only undated or non-comparable press figures were found: "more than 195,000 citizens
        enrolled" (undated), "more than 150 healthcare facilities provide IFHAS services"
        (c. 2024), newborn-screening uptake 98% (2021 MOHAP data, a DIFFERENT programme), and
        322,000 school screenings in 2024 (a DIFFERENT programme). None is a programme
        performance statistic for IFHAS or Well-Child Visits.
      also_checked: >-
        https://www.ifhas.gov.ae/ returns HTTP 404, despite being named as the programme's
        destination in an official DoH media release dated 2025-08-01.
      manual_instructions: >-
        Submit a formal aggregate-data request to IFHAS.Support@adphc.gov.ae and
        WCV.Support@adphc.gov.ae, copying the DoH Data and Digital Governance Office
        (DDG@doh.gov.ae). Request AGGREGATE, de-identified programme indicators only, citing
        IFHAS Appendix 9 and WCV §5.1 which define the KPIs the programme already reports
        internally. NEVER request identifiable patient records.
    coverage: n/a — nothing obtained
    relevance: >-
      This is THE critical gap for PulseReach. Without it there is no real baseline for
      screening participation, so no model can be calibrated or validated against actual
      programme performance.
    limitations:
      - >-
        MUST NOT be confused with the IFHAS quality indicators in the clinical standard.
        Appendix 9's ">85% participation rate" is a TARGET and a DEFINITION, not an observed
        value. The same applies to the WCV §5.1 "target 100%" figures. Treating either as
        programme performance data would be a fabrication.
      - >-
        Every screening record in PulseReach is therefore synthetic, and the UI must say so
        wherever it displays one.
    belongs_in: nowhere
    verification: verified   # verified ABSENT from public sources, by direct search
    validation: none

