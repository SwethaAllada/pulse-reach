      downloaded: 2026-11-15
      http_status: 200
      features_total: 5339
      layers:
        - {id: 330, slug: hospitals,                features: 114}
        - {id: 329, slug: health_centres,           features: 1290}
        - {id: 328, slug: clinics,                  features: 1250}
        - {id: 332, slug: pharmacy,                 features: 1715}
        - {id: 234, slug: rehabilitation_center,    features: 434}
        - {id: 236, slug: provision_health_service, features: 387}
        - {id: 217, slug: diagnostic_centers,       features: 87}
        - {id: 235, slug: mobile_health_unit,       features: 49}
        - {id: 231, slug: dialysis_centre,          features: 13}
      acquisition_log: data/raw/abudhabi_sdi/acquisition_log.json
      script: data-pipeline/ingestion/fetch_abudhabi_sdi_facilities.py
      modified_after_download: false
    reference_period: >-
      Live licensing register. Catalogue entries modified 2025-07-25/28. Rows carry
      PRELIMISSUEDATE and EXPIRYDATE; there is no single publication date.
    coverage: >-
      Emirate of Abu Dhabi. REGION populated as Abu Dhabi (3,178) / Al Ain (1,236) /
      Al Dhafra (491); 434 rows (all rehabilitation_center) have a blank region.
      FACILITY-LEVEL, not patient-level. Contains no personal data.
    permitted_reuse: >-
      Abu Dhabi Government Open Data License, read verbatim 2026-11-15 from
      data.abudhabi/opendata/jsonapi/node/open_data_license: "The Information Provider grants
      you a worldwide, royalty-free, perpetual, non-exclusive license to use the Information,
      including for commercial purposes" — free to "copy, modify, publish, translate, adapt,
      distribute or otherwise use the information in any medium ... for any lawful purpose",
      conditional on acknowledging the source and linking the licence. EXEMPTIONS: the licence
      grants NO right to use Personal Information, third-party rights, or official
      names/crests/logos. Licensed "as is", no warranty. Governed by the Abu Dhabi Government
      Open Data Policy v1.0.
    relevance: >-
      Closes gap H6. Real facility names and coordinates replace the invented locations the
      prior plan required, which is what makes a geographic outreach view honest.
    limitations:
      - >-
        THIQA, BASIC and ENHANCED are "N/A" in every row. They look like insurance-acceptance
        flags and carry NO information. IFHAS Thiqa eligibility CANNOT be derived from this file.
      - >-
        BEDS, SPECIALITIES and PROFESSIONALS are semicolon-delimited composite strings, not
        numbers (e.g. "Acute Care , Pediatric , 38 , 0 , 0; ..."). Casting them yields nothing.
        INPATIENTBEDCAPACITY is the plain integer.
      - >-
        Only 3,005 of 5,339 rows are LICENSESTATUS "Active". The rest are cancelled, expired,
        preliminary or pending. Filter before treating a row as an operating facility.
      - >-
        40 of 5,339 features (0.75%) had defective geometry: 31 lon/lat transposed, 6 at (0,0),
        3 outside the emirate (2 in Saudi Arabia). Repaired or flagged in data/processed/,
        never dropped; see geo_quality.
      - >-
        Does NOT reconcile with SCAD by definition. Active-only: 71 hospitals / 8,828 beds here
        vs 75 hospitals / 8,082 beds in SCAD 2801/4111 (5% and 9% variance). Licensed capacity
        is not operational beds. DO NOT COMBINE.
      - Undocumented service path; the previous path (Pub/CF_Health) already 404s.
    belongs_in: data/raw/abudhabi_sdi/
    verification: verified
    validation: structural

