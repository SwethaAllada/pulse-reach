  description: >-
    Well-Child visit at 18 months: age, required preventive and developmental assessments, and follow-up
    requirements.
  requires_clinical_review: false
  open_question_ids:
  - OQ-WCV-DUE-WINDOW
  - OQ-WCV-EFFECTIVE-DATE
  - OQ-COMMON-AGE-CALC
  history: []
  notes: >-
    Visit age is verified. The standard defines no due, grace or overdue window, so due_window is null.
    Immunisation content is delegated by the standard to EPI circular No. 39/2024 and is not encoded.
  spec:
    visit_id: wcv_18m
    visit_number: 8
    visit_label: 18 months
    timing:
      recommended_age:
        value: 18
        unit: months
        as_printed: 18 months
      age_band: early_childhood
      age_band_source: sections 3.2.5-3.2.7, PDF p.4
      due_window: null
      due_window_status: not_specified_by_standard
      open_question_ids:
      - OQ-WCV-DUE-WINDOW
    preventive_assessments:
    - code: physical_examination_vital_signs
      description: Thorough physical examination including vital signs recording.
      source_reference: DOH/WCV/SD/10/2025, section 3.2.1, PDF p.4; Appendix 1 ('18 months' row), PDF
        p.20
      verification_status: verified
      open_question_ids: []
    - code: weight
      description: Measure weight.
      source_reference: DOH/WCV/SD/10/2025, Appendix 1 ('18 months' row), PDF p.20
      verification_status: verified
      open_question_ids: []
    - code: head_circumference
      description: Measure head circumference.
      source_reference: DOH/WCV/SD/10/2025, Appendix 1 ('18 months' row), PDF p.20; section 3.8.1.5, PDF
        p.7
      verification_status: verified
      open_question_ids: []
    - code: growth_zscore_plot
      description: Plot Z-scores on WHO child growth standards.
      source_reference: DOH/WCV/SD/10/2025, Appendix 1 ('18 months' row), PDF p.20; section 3.8.4, PDF
        p.8
      verification_status: verified
      components:
      - Length for age
      - Weight for age
      - Weight for length
      open_question_ids: []
    - code: vision_screening
      description: Vision and eye screening per the age-specific battery.
      source_reference: DOH/WCV/SD/10/2025, Appendix 1 ('18 months' row), PDF p.20; section 3.4.1, PDF
        p.5
      verification_status: verified
      components:
      - External eye exam
      - Light Reflex
      - Visual Acuity (Fix and Follow)
      - Corneal light reflex test
      - Cardiff Acuity Test
      - Cover/uncover Test
      open_question_ids: []
    - code: oral_examination
      description: >-
        Oral examination by a dentist or hygienist in a dental clinic setting (intraoral examination;
        hard tissue, soft tissue, caries risk assessment; oral health guidance to parents).
      source_reference: DOH/WCV/SD/10/2025, Appendix 1 ('18 months' row), PDF p.20; section 3.7.5, PDF
        p.6; Appendix 4, PDF pp.25-26
      verification_status: verified
      open_question_ids: []
    - code: cbc
      description: CBC for iron deficiency anemia screening.
      source_reference: DOH/WCV/SD/10/2025, Appendix 1 ('18 months' row), PDF p.20; section 3.6.1, PDF
        p.5
      verification_status: verified
      condition: >-
        if not done at 12 months (section 3.6.1 also allows testing at 15 or 18 months where risk factors
        trigger the need)
      open_question_ids: []
    developmental_assessments:
    - code: parent_child_interaction_observation
      description: General observation of parent-child interaction.
      source_reference: DOH/WCV/SD/10/2025, Appendix 1 ('18 months' row), PDF p.20
      verification_status: verified
      open_question_ids: []
    - code: developmental_milestones
      description: >-
        Developmental milestone surveillance across 4 domains (Social Language and Self-help; Verbal Language;
        Gross Motor; Fine Motor), per Appendix 6.
      source_reference: DOH/WCV/SD/10/2025, Appendix 1 ('18 months' row), PDF p.20; section 3.8.5, PDF
        p.8; Appendix 6, PDF pp.28-32
      verification_status: verified
      open_question_ids: []
    - code: m_chat_r
      description: >-
        Autism screening with the modified checklist for autism in toddlers, revised (M-CHAT-R). A screening
        result only; not a diagnosis.
      source_reference: DOH/WCV/SD/10/2025, Appendix 1 ('18 months' row), PDF p.20; section 3.8.4.1, PDF
        p.8; Appendix 5.1, PDF p.27
      verification_status: verified
      open_question_ids: []
    - code: idaq
      description: >-
        Interim Development Assessment Questionnaire (IDAQ, 6 questions) completed by parents and reviewed
        at the visit by a family physician, pediatrician or general practitioner. ASQ-3/ASQ-4 to follow
        upon DoH-ADPHC circular.
      source_reference: DOH/WCV/SD/10/2025, Appendix 1 ('18 months' row), PDF p.20; section 3.8.4.2, PDF
        p.8; Appendix 5.2, PDF p.27
      verification_status: verified
      open_question_ids: []
    follow_up_requirements:
    - code: positive_screening_follow_up
      description: >-
        Infants and children with positive screening results receive appropriate follow-up or referral;
        initial follow-up referral initiated within 7 days of results; specialist evaluation or diagnostic
        testing scheduled within 2-4 weeks depending on severity and urgency.
      source_reference: DOH/WCV/SD/10/2025, section 3.9.1.2-3.9.1.4, PDF p.8
      verification_status: verified
      rule_refs:
      - WCV-FU-REFERRAL-INITIATION-7D
      - WCV-FU-SPECIALIST-EVALUATION-2-4W
      open_question_ids:
      - OQ-WCV-MCHAT-FOLLOWUP-TIMING
    - code: vision_abnormality_referral
      description: >-
        Immediate referral to the ophthalmology clinic for any listed abnormality (structural anomaly;
        absent, white, dull or asymmetric red reflex; infant risk factors; family history of retinoblastoma,
        cataracts, glaucoma or retinal abnormalities).
      source_reference: DOH/WCV/SD/10/2025, section 3.4.4, PDF p.5
      verification_status: verified
      open_question_ids: []
    - code: anemia_further_evaluation
      description: >-
        Children with a laboratory finding of anemia (hemoglobin <11 g/dL for <6 years of age) should
        be further evaluated to determine the underlying etiology.
      source_reference: DOH/WCV/SD/10/2025, section 3.6.3, PDF p.6
      verification_status: verified
      open_question_ids: []
      notes: A screening finding that triggers evaluation; not a diagnosis.
    - code: m_chat_r_tier_follow_up
      description: Follow-up by M-CHAT-R score tier (0-2, 3-7, 8 or above).
      source_reference: DOH/WCV/SD/10/2025, Appendix 5.1, PDF p.27
      verification_status: verified
      rule_refs:
      - WCV-MCHATR-LOW
      - WCV-MCHATR-MODERATE
      - WCV-MCHATR-HIGH
      open_question_ids:
      - OQ-WCV-MCHAT-FOLLOWUP-TIMING
      - OQ-WCV-MCHAT-REFERRAL-TARGET
    - code: idaq_referral
      description: >-
        Refer to a pediatric neurologist or neurodevelopment clinic if question 1 is YES or any of questions
        2-6 is NO.
      source_reference: DOH/WCV/SD/10/2025, section 3.8.4.2, PDF p.8; Appendix 5.2, PDF p.27
      verification_status: verified
      rule_refs:
      - WCV-IDAQ-REFERRAL
      open_question_ids: []
    history_components:
      source_reference: DOH/WCV/SD/10/2025, Appendix 1 ('18 months' row), PDF p.20
      items:
      - Maternal history
      - Birth history
      - Feeding /nutritional history
      - Immunization
      - Past medical history
      - Allergy
      - Drug history
      - Family history
      - Socio-economic history
      notes: Appendix 1 numbers this list 1-6 then 8-10 (no item 7); preserved as printed.
    counselling_elements:
      source_reference: DOH/WCV/SD/10/2025, Appendix 1 ('18 months' row), PDF p.20
      items:
      - Breastfeeding
      - Sleeping pattern
      - Oral hygiene
      - General safety
      - Nutrition
      - Supplement (Vitamin D)
      - Secondhand smoking prevention
      - Physical activity
      - Injury prevention
