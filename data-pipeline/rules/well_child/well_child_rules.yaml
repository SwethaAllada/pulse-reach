    eligible for the screening and testing under that specific age group.
  requires_clinical_review: false
  open_question_ids:
  - OQ-WCV-DUE-WINDOW
  history: []
  notes: Stated in the payment section. 'Defaulter' and the permitted lateness are not defined.
