# Well-Child Visit rules.
# Source: DOH/WCV/SD/10/2025 (V10, Revised, December 2025). EFFECTIVE DATE: TBD.
# This is the current published standard, NOT a confirmed in-force regulation.
# 14 visits (section 3.2.3 + Appendix 1), M-CHAT-R tiers (Appendix 5.1), IDAQ (5.2),
# follow-up windows (3.9.1). Page references are PDF page indexes.
#
#  - Assessment items carry their own source_reference and verification_status.
#    Items marked `unresolved` are source discrepancies; see ../common/open_questions.yaml.
#  - due_window is null everywhere: the standard defines visit ages only.
#  - M-CHAT-R / IDAQ outcomes are screening results, never diagnoses.
config:
  pathway: well_child
  config_version: 1.0.0
  clinical_review_status: not_reviewed
  publication_status: current_published_standard
  effective_date_as_printed: TBD
  disclaimer: >-
    Transcription of a published DoH standard for engineering use. Not clinically validated; not a compliance
    claim. The standard's Effective Date is TBD. All outputs require healthcare-professional review.
rules:
- rule_id: WCV-PROG-SCOPE
  pathway: well_child
  rule_type: programme_scope
  rule_version: 1.0.0
  source_name: Standard for Well-Child Visits
  source_version: V10
  source_reference: DOH/WCV/SD/10/2025, section 1.1 (PDF p.3) and section 3.2.7 (PDF p.4)
  verification_status: verified
  effective_date: null
  effective_date_note: >-
    Standard states 'Effective Date: TBD'. Current published standard (V10, Revised, December 2025), not
    a confirmed in-force regulation.
  last_reviewed: '2026-11-14'
  description: >-
    Standard applies to Well-Child visit screening for children aged 1 month to 6 years in licensed facilities
    in the Emirate of Abu Dhabi; newborn ages follow the Newborn Screening Standard.
  requires_clinical_review: false
  open_question_ids:
  - OQ-COMMON-AGE-CALC
  history: []
  notes: null
  spec:
    age_min:
      value: 1
      unit: months
    age_max:
      value: 6
      unit: years
    as_printed: children aged 1 month to 6 years
    newborns: follow the newborn standard
- rule_id: WCV-PROG-EFFECTIVE-DATE-TBD
  pathway: well_child
  rule_type: programme_status
  rule_version: 1.0.0
  source_name: Standard for Well-Child Visits
  source_version: V10
  source_reference: DOH/WCV/SD/10/2025, document control table, PDF p.2
  verification_status: unresolved
  effective_date: null
  effective_date_note: >-
    Standard states 'Effective Date: TBD'. Current published standard (V10, Revised, December 2025), not
    a confirmed in-force regulation.
  last_reviewed: '2026-11-14'
  description: >-
    The Well-Child Visit standard's Effective Date is stated as TBD. It is the current published standard
    (V10, Revised, December 2025), not a confirmed in-force regulation.
  requires_clinical_review: true
  open_question_ids:
  - OQ-WCV-EFFECTIVE-DATE
  history: []
  notes: Surface this status wherever Well-Child outputs are shown.
  spec:
    effective_date_as_printed: TBD
    publication_date: 2025-12
    in_force_status: not_confirmed
- rule_id: WCV-TIMING-DUE-WINDOW
  pathway: well_child
  rule_type: visit_timing
  rule_version: 1.0.0
  source_name: Standard for Well-Child Visits
  source_version: V10
  source_reference: DOH/WCV/SD/10/2025, section 3.2.3 (PDF p.4) and Appendix 1 (PDF pp.17-23)
  verification_status: unresolved
  effective_date: null
  effective_date_note: >-
    Standard states 'Effective Date: TBD'. Current published standard (V10, Revised, December 2025), not
    a confirmed in-force regulation.
  last_reviewed: '2026-11-14'
  description: >-
    Unresolved: the standard lists the 14 visit ages but defines no due, grace or overdue window. No window
    is encoded.
  requires_clinical_review: true
  open_question_ids:
  - OQ-WCV-DUE-WINDOW
  history: []
  notes: null
  spec:
    due_window: null
    engine_handling: requires_clinical_review
- rule_id: WCV-VISIT-01M
  pathway: well_child
  rule_type: visit_schedule
  rule_version: 1.0.0
  source_name: Standard for Well-Child Visits
  source_version: V10
  source_reference: DOH/WCV/SD/10/2025, section 3.2.3 (PDF p.4) and Appendix 1 (PDF p.17)
  verification_status: verified
  effective_date: null
  effective_date_note: >-
    Standard states 'Effective Date: TBD'. Current published standard (V10, Revised, December 2025), not
    a confirmed in-force regulation.
  last_reviewed: '2026-11-14'
  description: >-
    Well-Child visit at 1 month: age, required preventive and developmental assessments, and follow-up
    requirements.
  requires_clinical_review: false
  open_question_ids:
  - OQ-WCV-DUE-WINDOW
  - OQ-WCV-EFFECTIVE-DATE
  - OQ-COMMON-AGE-CALC
  history: []
  notes: >-
    Visit age is verified. The standard defines no due, grace or overdue window, so due_window is null.
    Immunisation content is delegated by the standard to EPI circular No. 39/2024 and is not encoded.
  spec:
    visit_id: wcv_1m
    visit_number: 1
    visit_label: 1 month
    timing:
      recommended_age:
        value: 1
        unit: months
        as_printed: 1 month
      age_band: infancy
      age_band_source: sections 3.2.5-3.2.7, PDF p.4
      due_window: null
      due_window_status: not_specified_by_standard
      open_question_ids:
      - OQ-WCV-DUE-WINDOW
    preventive_assessments:
    - code: physical_examination_vital_signs
      description: Thorough physical examination including vital signs recording.
      source_reference: DOH/WCV/SD/10/2025, section 3.2.1, PDF p.4; Appendix 1 ('1 month' row), PDF p.17
      verification_status: verified
      open_question_ids: []
    - code: weight
      description: Measure weight.
      source_reference: DOH/WCV/SD/10/2025, Appendix 1 ('1 month' row), PDF p.17
      verification_status: verified
      open_question_ids: []
    - code: head_circumference
      description: Measure head circumference.
      source_reference: DOH/WCV/SD/10/2025, Appendix 1 ('1 month' row), PDF p.17; section 3.8.1.5, PDF
        p.7
      verification_status: verified
      open_question_ids: []
    - code: growth_zscore_plot
      description: Plot Z-scores on WHO child growth standards.
      source_reference: DOH/WCV/SD/10/2025, Appendix 1 ('1 month' row), PDF p.17; section 3.8.4, PDF p.8
      verification_status: verified
      components:
      - Length for age
      - Weight for age
      - Weight for length
      open_question_ids: []
    - code: vision_screening
      description: Vision and eye screening per the age-specific battery.
      source_reference: DOH/WCV/SD/10/2025, Appendix 1 ('1 month' row), PDF p.17; section 3.4.1, PDF p.5
      verification_status: verified
      components:
      - External eye exam
      - Red Reflex
      open_question_ids: []
      notes: >-
        Appendix 1 also states: inquire further history (premature, NICU graduates, family history of
        strabismus/amblyopia, syndromic children, retinoblastoma, congenital cataract or congenital glaucoma);
        refer to ophthalmologists for comprehensive screening.
    - code: hearing_screening
      description: Hearing test.
      source_reference: DOH/WCV/SD/10/2025, Appendix 1 ('1 month' row), PDF p.17; section 3.3.4, PDF p.5
      verification_status: verified
      condition: >-
        if not done earlier / failed in newborn hearing screening (Appendix 1); if not performed at birth,
        complete at 1 or 2 months old (section 3.3.4)
      open_question_ids: []
    - code: hip_examination
      description: Ortolani and Barlow tests for Developmental Dysplasia of the Hips (DDH).
      source_reference: DOH/WCV/SD/10/2025, Appendix 1 ('1 month' row), PDF p.17; section 3.5.4, PDF p.5
      verification_status: verified
      open_question_ids: []
    developmental_assessments:
    - code: parent_child_interaction_observation
      description: General observation of parent-child interaction.
      source_reference: DOH/WCV/SD/10/2025, Appendix 1 ('1 month' row), PDF p.17
      verification_status: verified
      open_question_ids: []
    - code: developmental_milestones
      description: >-
        Developmental milestone surveillance across 4 domains (Social Language and Self-help; Verbal Language;
        Gross Motor; Fine Motor), per Appendix 6.
      source_reference: DOH/WCV/SD/10/2025, Appendix 1 ('1 month' row), PDF p.17; section 3.8.5, PDF p.8;
        Appendix 6, PDF pp.28-32
      verification_status: verified
      open_question_ids: []
    follow_up_requirements:
    - code: positive_screening_follow_up
      description: >-
        Infants and children with positive screening results receive appropriate follow-up or referral;
        initial follow-up referral initiated within 7 days of results; specialist evaluation or diagnostic
        testing scheduled within 2-4 weeks depending on severity and urgency.
      source_reference: DOH/WCV/SD/10/2025, section 3.9.1.2-3.9.1.4, PDF p.8
      verification_status: verified
      rule_refs:
      - WCV-FU-REFERRAL-INITIATION-7D
      - WCV-FU-SPECIALIST-EVALUATION-2-4W
      open_question_ids: []
    - code: vision_abnormality_referral
      description: >-
        Immediate referral to the ophthalmology clinic for any listed abnormality (structural anomaly;
        absent, white, dull or asymmetric red reflex; infant risk factors; family history of retinoblastoma,
        cataracts, glaucoma or retinal abnormalities).
      source_reference: DOH/WCV/SD/10/2025, section 3.4.4, PDF p.5
      verification_status: verified
      open_question_ids: []
    - code: hip_abnormality_referral
      description: If any abnormality is detected, refer the child to the Pediatric/Ortho clinic for further
        evaluation.
      source_reference: DOH/WCV/SD/10/2025, section 3.5.6, PDF p.5
      verification_status: verified
      open_question_ids: []
    history_components:
      source_reference: DOH/WCV/SD/10/2025, Appendix 1 ('1 month' row), PDF p.17
      items:
      - Maternal history
      - Birth history
      - Feeding /nutritional history
      - Immunization
      - Past medical history
      - Allergy
      - Drug history
      - Family history
      - Socio-economic history
      notes: Appendix 1 numbers this list 1-6 then 8-10 (no item 7); preserved as printed.
    counselling_elements:
      source_reference: DOH/WCV/SD/10/2025, Appendix 1 ('1 month' row), PDF p.17
      items:
      - Breastfeeding
      - Sleeping pattern
      - Oral hygiene
      - General safety
      - Nutrition
      - Supplement (Vitamin D)
      - Secondhand smoking prevention
      - Physical activity
      - Injury prevention
      - Sudden infant death syndrome prevention (SIDS)
