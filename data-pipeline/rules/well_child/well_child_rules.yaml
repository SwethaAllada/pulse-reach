- rule_id: WCV-POLICY-CATCHUP-ELIGIBILITY
  pathway: well_child
  rule_type: policy
  rule_version: 1.0.0
  source_name: Standard for Well-Child Visits
  source_version: V10
  source_reference: DOH/WCV/SD/10/2025, section 3.10.1.3, PDF p.9
  verification_status: verified
