      If the child is attending as a defaulter (catch up vaccine visit) within the Well-child visits schedule,
      then the child is eligible to the screening and testing under that specific age group.
- rule_id: WCV-POLICY-PARENTAL-REFUSAL
  pathway: well_child
  rule_type: policy
  rule_version: 1.0.0
  source_name: Standard for Well-Child Visits
  source_version: V10
  source_reference: DOH/WCV/SD/10/2025, section 4.2.1, PDF p.12
  verification_status: verified
  effective_date: null
  effective_date_note: >-
    Standard states 'Effective Date: TBD'. Current published standard (V10, Revised, December 2025), not
    a confirmed in-force regulation.
  last_reviewed: '2026-11-14'
  description: >-
    If a parent or guardian refuses the recommended screening, they are informed of the consequences and
    the refusal is officially documented in the child's medical record with their signature. Refusal is
    distinct from 'not yet done'.
  requires_clinical_review: false
  open_question_ids:
  - OQ-WCV-REFUSAL-STATE
  history: []
  notes: null
  spec:
    as_printed: >-
      If a parent or guardian refuses the recommended screening services, they shall be informed about
      the potential consequences of their decision. Their refusal shall be officially documented in the
      infant's or child's medical record, including their signature, as outlined in each facility refusal
      form
