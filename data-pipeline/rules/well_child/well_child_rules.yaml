- rule_id: WCV-IDAQ-REFERRAL
  pathway: well_child
  rule_type: developmental_screening_tier
  rule_version: 1.0.0
  source_name: Standard for Well-Child Visits
  source_version: V10
  source_reference: DOH/WCV/SD/10/2025, section 3.8.4.2 (PDF p.8) and Appendix 5.2 (PDF p.27)
  verification_status: verified
  effective_date: null
  effective_date_note: >-
    Standard states 'Effective Date: TBD'. Current published standard (V10, Revised, December 2025), not
    a confirmed in-force regulation.
  last_reviewed: '2026-11-14'
  description: >-
    IDAQ at 18 months (6 questions): if question 1 is answered YES, or any of questions 2-6 is answered
    NO, the child is directed to a pediatric neurologist or neurodevelopment clinic for a thorough developmental
    assessment. A screening result, not a diagnosis.
  requires_clinical_review: false
  open_question_ids: []
  history: []
  notes: No referral window is stated for the IDAQ pathway.
  spec:
    instrument: IDAQ
    administered_at_months:
    - 18
    is_screening_result_only: true
    is_diagnosis: false
    questions:
    - number: 1
      text: Do you have any concerns regarding the development of your child?
      refer_if: 'YES'
    - number: 2
      text: Does your child walk alone without holding onto anything?
      refer_if: 'NO'
    - number: 3
      text: Does your child pick up small objects (like a piece of cereal) using their thumb and index
        finger?
      refer_if: 'NO'
    - number: 4
      text: Does your child say at least 6 different words, other than names?
      refer_if: 'NO'
    - number: 5
      text: Does your child copy you if you do something simple, like pretending to brush hair or using
        a spoon?
      refer_if: 'NO'
    - number: 6
      text: Does your child look at you when you call their name?
      refer_if: 'NO'
    referral_target: pediatric neurologist or neurodevelopment clinic
    referral_window: null
    note: ASQ-3/ASQ-4 to follow IDAQ upon a DoH-ADPHC circular; not encoded.
