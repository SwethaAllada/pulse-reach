# IFHAS adult preventive screening rules.
# Source: DoH/SD/ADPHC-CHS/IFHAS/V10/2025 (V10, July 2025). Appendix 7 = PDF pp.19-22.
# 20 screening packages (Appendix 7) + programme-level eligibility (4.5) + workflow timings.
#
# Conventions
#  - `as_printed` fields preserve the standard's own wording; numeric fields are
#    derived from it. Never edit one without the other.
#  - verification_status: verified | reported | unresolved (see ../common/status_definitions.yaml).
#  - requires_clinical_review: true blocks authoritative evaluation even where the
#    transcription is verified (ambiguous or conflicting criteria).
#  - Update rules by bumping rule_version and moving the old version into `history`;
#    never delete or rewrite source_reference.
config:
  pathway: ifhas
  config_version: 1.0.0
  clinical_review_status: not_reviewed
  disclaimer: >-
    Transcription of a published DoH standard for engineering use. Not clinically validated; not a compliance
    claim. All outputs require healthcare-professional review.
rules:
- rule_id: IFHAS-PROG-ELIG-THIQA
  pathway: ifhas
  rule_type: programme_eligibility
  rule_version: 1.0.0
  source_name: Standard for the Provision of the Periodic Comprehensive Screening Program for Adults -
    IFHAS
  source_version: V10
  source_reference: DoH/SD/ADPHC-CHS/IFHAS/V10/2025, section 4.5.1, PDF p.6
  verification_status: verified
  effective_date: 2025-07
  last_reviewed: '2026-11-14'
  description: Participant must be a member of the THIQA programme.
  requires_clinical_review: false
  open_question_ids: []
  history: []
  notes: Programme-level requirement. Does not establish eligibility for any package on its own.
  spec:
    attribute: thiqa_member
    required_value: true
    as_printed: Member of the THIQA program
- rule_id: IFHAS-PROG-ELIG-MIN-AGE
  pathway: ifhas
  rule_type: programme_eligibility
  rule_version: 1.0.0
  source_name: Standard for the Provision of the Periodic Comprehensive Screening Program for Adults -
    IFHAS
  source_version: V10
  source_reference: DoH/SD/ADPHC-CHS/IFHAS/V10/2025, section 4.5.2, PDF p.6
  verification_status: verified
  effective_date: 2025-07
  last_reviewed: '2026-11-14'
  description: Participant must be 18 years old and above (programme-level statement; no upper bound is
    printed here).
  requires_clinical_review: false
  open_question_ids:
  - OQ-IFHAS-AGE-CEILING
  - OQ-COMMON-AGE-CALC
  history: []
  notes: >-
    Package-specific age bands (Appendix 7) are the operative rules. This clause alone must not be used
    to treat people above 75 as eligible for any package.
  spec:
    attribute: age_years
    min_years: 18
    max_years: null
    as_printed: 18 years old and above
- rule_id: IFHAS-PROG-ELIG-SEX-BY-PACKAGE
  pathway: ifhas
  rule_type: programme_eligibility
  rule_version: 1.0.0
  source_name: Standard for the Provision of the Periodic Comprehensive Screening Program for Adults -
    IFHAS
  source_version: V10
  source_reference: DoH/SD/ADPHC-CHS/IFHAS/V10/2025, section 4.5.3, PDF p.6
  verification_status: verified
  effective_date: 2025-07
  last_reviewed: '2026-11-14'
  description: Female or male based on the specific screening programme eligibility criteria (see each
    package rule).
  requires_clinical_review: false
  open_question_ids:
  - OQ-COMMON-SEX-ATTRIBUTE
  history: []
  notes: null
  spec:
    attribute: sex
    as_printed: Female or male based on the specific Screening Program eligibility criteria.
- rule_id: IFHAS-PROG-AGE-CEILING
  pathway: ifhas
  rule_type: programme_eligibility
  rule_version: 1.0.0
  source_name: Standard for the Provision of the Periodic Comprehensive Screening Program for Adults -
    IFHAS
  source_version: V10
  source_reference: DoH/SD/ADPHC-CHS/IFHAS/V10/2025, section 4.5.2 (PDF p.6) vs Appendix 7 (PDF pp.19-22)
  verification_status: unresolved
  effective_date: 2025-07
  last_reviewed: '2026-11-14'
  description: >-
    Unresolved: section 4.5.2 says 18 and above, every Appendix 7 package ends at 75 or younger, and ADPHC
    communications are reported to say 18-75. No universal rule for people above 75 is encoded.
  requires_clinical_review: true
  open_question_ids:
  - OQ-IFHAS-AGE-CEILING
  history: []
  notes: Placeholder that makes the ambiguity explicit data. It carries no threshold and cannot be evaluated.
  spec:
    engine_handling: requires_clinical_review
    sources_in_conflict:
    - 'IFHAS V10 section 4.5.2: ''18 years old and above'' (verified)'
    - 'IFHAS V10 Appendix 7: package bands end at or before 75 (verified)'
    - 'ADPHC news Feb 2024: ''aged between 18 to 75 years'' (reported, not re-checked)'
    - 'ADPHC programme page: ''18 and above'' (reported)'
