- rule_id: IFHAS-PKG-LUNG-LDCT-55-75
  pathway: ifhas
  rule_type: screening_package
  rule_version: 1.0.0
  source_name: Standard for the Provision of the Periodic Comprehensive Screening Program for Adults -
    IFHAS
  source_version: V10
  source_reference: DoH/SD/ADPHC-CHS/IFHAS/V10/2025, Appendix 7, PDF p.22
  verification_status: verified
  effective_date: 2025-07
  last_reviewed: '2026-11-14'
  description: 'Lung Cancer Screening for Male & Female: target group 55-75 years High Risk*; frequency
    Annually.'
  requires_clinical_review: true
  open_question_ids:
  - OQ-IFHAS-LUNG-CRITERIA
  history: []
  notes: >-
    Footnote: 'Criteria for High-Risk Lung Cancer screening: (Refer to DoH Lung Cancer Screening Service
    Specifications Appendix 5 for calculation of pack-year tobacco use).' The combination logic ('and/or')
    and the pack-year method are not machine-evaluable here.
  spec:
    package_name: Lung Cancer Screening for Male & Female
    package_group: lung_cancer_screening
    eligibility:
      age:
        min_years: 55
        max_years: 75
        as_printed: 55-75 years High Risk*
      sex:
      - female
      - male
      conditions:
      - kind: inclusion
        as_printed: 30 Pack-year history of smoking, and/or tobacco cessation <15 years.
        machine_evaluable: false
      - kind: inclusion
        as_printed: 20 Pack-year history of tobacco use, and/or tobacco cessation <15 years and one additional
          risk factor .
        machine_evaluable: false
      - kind: inclusion
        as_printed: 20 Year history of water pipe (Shisha) and/or Dokha, Medwakh and/or all other forms
          of smoked tobacco use.
        machine_evaluable: false
    frequency:
      as_printed: Annually
      type: recurring
      interval:
        value: 1
        unit: years
    one_time: false
    components:
    - Consultation and Low dose CT scan
